<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#130f1b">
<title>YahBible</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="fishbg"><img src="assets/holy-fish.png" alt=""></div>

  <header id="topbar">
    <button class="topbtn menubtn" id="leftmenubtn" title="Sources" aria-label="Open sources menu" hidden>☰</button>
    <div class="wordmark"><span class="heb">א</span><span class="yb">YahBible</span><span class="heb">ת</span>
      <button class="tavlink" id="tavbtn" title="Ask Tav'iel">&#9834; Tav&rsquo;iel</button></div>
    <div class="topright">
      <button class="topbtn" id="settingsbtn" title="Settings & account" aria-label="Settings">⚙️</button>
      <button class="topbtn" id="cambtn" title="Self-cam for streaming" aria-label="Self-cam">🎥</button>
      <button class="topbtn menubtn" id="rightmenubtn" title="Verse study" aria-label="Open verse study" hidden>☰</button>
    </div>
  </header>

  <main id="view"></main>

  <!-- LEFT drawer: sources (all the sacred books) — mirrors the desktop left menu -->
  <div id="scrim" hidden></div>
  <aside id="leftdrawer" class="drawer left" hidden aria-label="Sources"></aside>
  <!-- RIGHT drawer: verse study (word breakdown, versions, original language) — mirrors the desktop right panel -->
  <aside id="rightdrawer" class="drawer right" hidden aria-label="Verse study"></aside>

  <nav id="tabbar">
    <button class="tab" data-tab="home"><span class="ti">🏠</span>Home</button>
    <button class="tab" data-tab="bible"><span class="ti">📖</span>Bible</button>
    <button class="tab" data-tab="commandments"><span class="ti">📜</span>Study</button>
    <button class="tab" data-tab="repent"><span class="ti">🕊</span>Repent</button>
    <button class="tab" data-tab="news"><span class="ti">✨</span>News</button>
  </nav>

  <!-- draggable self-cam overlay (circle / green-screen) for TikTok screen-share -->
  <div id="cam">
    <video id="camvid" autoplay playsinline muted></video>
    <div id="camctl">
      <button id="camshape" title="Circle / green-screen">◐</button>
      <button id="camclose" title="Stop camera">✕</button>
    </div>
  </div>

  <script src="data/commandments.js"></script>
  <script src="data/repentance.js"></script>
  <script src="data/news.js"></script>
  <script src="data/kjv.js"></script>
  <script src="packs.js"></script>
  <script src="app.js"></script>
</body>
</html>
