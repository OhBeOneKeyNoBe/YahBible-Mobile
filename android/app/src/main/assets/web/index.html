<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#130f1b">
<title>YahBible</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="fishbg"><img src="assets/holy-fish.png" alt=""></div>

  <header id="topbar">
    <button class="topbtn menubtn" id="leftmenubtn" title="Sources" aria-label="Open sources menu" hidden>☰</button>
    <div class="wordmark"><span class="heb">א</span><span class="yb">YahBible</span><span class="heb">ת</span>
      <button class="tavlink" id="tavbtn" title="Ask Tav'iel">&#9834; Tav&rsquo;iel</button></div>
    <div class="topright">
      <button class="topbtn" id="settingsbtn" title="Settings & account" aria-label="Settings">⚙️</button>
      <button class="topbtn" id="cambtn" title="Self-cam for streaming" aria-label="Self-cam">🎥</button>
      <button class="topbtn menubtn" id="rightmenubtn" title="Verse study" aria-label="Open verse study" hidden>☰</button>
    </div>
  </header>

  <main id="view"></main>

  <!-- LEFT drawer: sources (all the sacred books) — mirrors the desktop left menu -->
  <div id="scrim" hidden></div>
  <aside id="leftdrawer" class="drawer left" hidden aria-label="Sources"></aside>
  <!-- RIGHT drawer: verse study (word breakdown, versions, original language) — mirrors the desktop right panel -->
  <aside id="rightdrawer" class="drawer right" hidden aria-label="Verse study"></aside>

  <nav id="tabbar">
    <button class="tab" data-tab="home"><span class="ti">🏠</span>Home</button>
    <button class="tab" data-tab="bible"><span class="ti">📖</span>Bible</button>
    <button class="tab" data-tab="commandments"><span class="ti">📜</span>Study</button>
    <button class="tab" data-tab="repent"><span class="ti">🕊</span>Repent</button>
    <button class="tab" data-tab="news"><span class="ti">✨</span>News</button>
  </nav>

  <!-- draggable self-cam overlay (circle / green-screen) for TikTok screen-share -->
  <div id="cam">
    <video id="camvid" autoplay playsinline muted></video>
    <div id="camctl">
      <button id="camshape" title="Circle / green-screen">◐</button>
      <button id="camclose" title="Stop camera">✕</button>
    </div>
  </div>

  <!-- OTA loader: runs the newest app+layout from the repo (cached), falls back to bundled offline.
       This is what makes the WHOLE app self-update (layout & features) without reinstalling. -->
  <script>
  (function(){
    var REMOTE='https://huggingface.co/OhBeOneKeyNoBe/YahBible-Mobile/resolve/main/www/';
    var SHELL=['app.css','data/commandments.js','data/repentance.js','data/news.js','data/kjv.js','packs.js','app.js'];
    function ck(f){return 'yb_ota_'+f;}
    function bundled(){ // inject the files shipped in the APK (offline fallback)
      SHELL.forEach(function(f){
        if(f.slice(-4)==='.css'){var l=document.createElement('link');l.rel='stylesheet';l.href=f;document.head.appendChild(l);}
        else{document.write('<script src="'+f+'"><\/script>');}
      });
    }
    function inject(f,txt){
      if(f.slice(-4)==='.css'){var s=document.createElement('style');s.textContent=txt;document.head.appendChild(s);}
      else{var sc=document.createElement('script');sc.text=txt;document.head.appendChild(sc);}
    }
    function runCached(){ // use the newest cached shell if we have a full set, else bundled
      try{
        for(var i=0;i<SHELL.length;i++){ if(localStorage.getItem(ck(SHELL[i]))==null){ bundled(); return; } }
        for(var j=0;j<SHELL.length;j++){ inject(SHELL[j], localStorage.getItem(ck(SHELL[j]))); }
      }catch(e){ bundled(); }
    }
    runCached();
    // background: fetch the latest shell; if anything changed, cache it for next launch
    setTimeout(function(){
      try{
        var changed=false, pending=SHELL.length;
        SHELL.forEach(function(f){
          fetch(REMOTE+f+'?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(t){
            if(t){ try{ if(localStorage.getItem(ck(f))!==t){ localStorage.setItem(ck(f),t); changed=true; } }catch(e){} }
            if(--pending===0 && changed){ try{ localStorage.setItem('yb_ota_ready','1'); }catch(e){}
              if(window.toast) toast('✨ Update ready — reopen the app to apply'); }
          }).catch(function(){ if(--pending===0 && changed && window.toast) toast('✨ Update ready — reopen the app'); });
        });
      }catch(e){}
    }, 2500);
  })();
  </script>
</body>
</html>
