<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#130f1b">
<title>YahBible</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="fishbg"><img src="assets/holy-fish.png" alt=""></div>

  <header id="topbar">
    <button class="topbtn menubtn" id="leftmenubtn" title="Sources" aria-label="Open sources menu">☰</button>
    <div class="wordmark"><span class="heb">א</span><span class="yb">YahBible</span><span class="heb">ת</span>
      <button class="tavlink" id="tavbtn" title="Ask Tav'iel">&#9834; Tav&rsquo;iel</button></div>
    <div class="topright">
      <button class="topbtn" id="cambtn" title="Self-cam / studio" aria-label="Self-cam">🎥</button>
      <button class="topbtn menubtn" id="rightmenubtn" title="Menu &amp; verse study" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main id="view"></main>

  <!-- FULL 1:1 desktop app, shown when the desktop is reachable; camera overlays float on top -->
  <iframe id="deskframe" title="YahBible" hidden></iframe>
  <button id="deskexit" title="Offline app" hidden>⤢</button>

  <!-- LEFT drawer: sources (all the sacred books) — mirrors the desktop left menu -->
  <div id="scrim" hidden></div>
  <aside id="leftdrawer" class="drawer left" hidden aria-label="Sources"></aside>
  <!-- RIGHT drawer: verse study (word breakdown, versions, original language) — mirrors the desktop right panel -->
  <aside id="rightdrawer" class="drawer right" hidden aria-label="Verse study"></aside>

  <nav id="tabbar">
    <button class="tab" data-tab="home"><span class="ti">🏠</span>Home</button>
    <button class="tab" data-tab="bible"><span class="ti">📖</span>Bible</button>
    <button class="tab" data-tab="commandments"><span class="ti">📜</span>Study</button>
    <button class="tab" data-tab="repent"><span class="ti">🕊</span>Repent</button>
    <button class="tab" data-tab="realizeus"><img class="ti tabimg" src="assets/realizeus.png" alt="">RealizeUS</button>
  </nav>

  <!-- draggable + pinch-resizable self-cam windows (front / back), each independent -->
  <div id="cam" class="camwin"><video id="camvid" autoplay playsinline muted></video></div>
  <div id="cam2" class="camwin"><video id="camvid2" autoplay playsinline muted></video></div>

  <!-- OTA loader — VERSION-GATED: only runs a cached web shell if it is strictly NEWER than the
       version bundled in this APK; otherwise always runs the bundled code. This prevents an old
       web copy from ever masking newer bundled features. -->
  <script>
  (function(){
    var BUNDLED_VER=20260914120;   // bump every APK build; OTA applies only if remote > this
    var REMOTE='https://huggingface.co/OhBeOneKeyNoBe/YahBible-Mobile/resolve/main/www/';
    var SHELL=['app.css','data/commandments.js','data/repentance.js','data/news.js','data/kjv.js','packs.js','app.js'];
    function ck(f){return 'yb_ota_'+f;}
    function bundled(){ SHELL.forEach(function(f){
        if(f.slice(-4)==='.css'){var l=document.createElement('link');l.rel='stylesheet';l.href=f;document.head.appendChild(l);}
        else{document.write('<script src="'+f+'"><\/script>');}
      }); }
    function inject(f,txt){ if(f.slice(-4)==='.css'){var s=document.createElement('style');s.textContent=txt;document.head.appendChild(s);}
        else{var sc=document.createElement('script');sc.text=txt;document.head.appendChild(sc);} }
    var cver=0; try{ cver=parseInt(localStorage.getItem('yb_ota_ver')||'0',10)||0; }catch(e){}
    var full=true; try{ for(var i=0;i<SHELL.length;i++){ if(localStorage.getItem(ck(SHELL[i]))==null){ full=false; break; } } }catch(e){ full=false; }
    if(full && cver>BUNDLED_VER){ try{ for(var j=0;j<SHELL.length;j++) inject(SHELL[j], localStorage.getItem(ck(SHELL[j]))); }catch(e){ bundled(); } }
    else { // bundled is newest (or no valid newer cache) — clear any stale cache and run bundled
      try{ if(cver<=BUNDLED_VER){ SHELL.forEach(function(f){localStorage.removeItem(ck(f));}); localStorage.removeItem('yb_ota_ver'); } }catch(e){}
      bundled();
    }
    // background: only cache a shell that is a NEWER version than we bundled
    setTimeout(function(){
      try{
        fetch(REMOTE+'version.txt?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(v){
          var rv=parseInt((v||'0').trim(),10)||0; if(rv<=BUNDLED_VER) return;   // nothing newer online
          var got={}, pending=SHELL.length;
          SHELL.forEach(function(f){ fetch(REMOTE+f+'?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(t){
            if(t) got[f]=t; if(--pending===0){ var ok=SHELL.every(function(x){return got[x]!=null;});
              if(ok){ try{ SHELL.forEach(function(x){localStorage.setItem(ck(x),got[x]);}); localStorage.setItem('yb_ota_ver',String(rv)); }catch(e){}
                if(window.toast) toast('✨ Update ready — reopen the app to apply'); } }
          }).catch(function(){ if(--pending===0){} }); });
        }).catch(function(){});
      }catch(e){}
    }, 3000);
  })();
  </script>
</body>
</html>
